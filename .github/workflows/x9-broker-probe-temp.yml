name: X9 Broker Probe Temp

on:
  push:
    paths:
      - '.github/workflows/x9-broker-probe-temp.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe ECOVACS MQTT long CONNECT shape
        shell: bash
        run: |
          python3 - <<'PY' | tee x9_broker_probe_result.txt
          import socket, ssl, hashlib, struct

          HOSTS=['mq.ecouser.net','jmq-ngiot-cn.dc.cn.ecouser.net']
          def encstr(s):
              b=s.encode(); return struct.pack('!H',len(b))+b
          def rem_len(n):
              out=bytearray()
              while True:
                  d=n%128; n//=128
                  if n: d|=0x80
                  out.append(d)
                  if not n: return bytes(out)
          def pkt(user,pwd,res,proto=4):
              cid=f'{user}@ecouser/{res}'
              if proto==4: vh=encstr('MQTT')+bytes([4])
              else: vh=encstr('MQIsdp')+bytes([3])
              vh+=bytes([0xC2])+struct.pack('!H',60)
              body=vh+encstr(cid)+encstr(user)+encstr(pwd)
              return bytes([0x10])+rem_len(len(body))+body
          tests=[]
          # Short control, then two long shapes around the 473-byte packet seen on the real session.
          tests.append(('short',pkt('u'*16,'p'*24,'r'*16,4)))
          tests.append(('long-approx-473',pkt('u'*32,'p'*341,'r'*32,4)))
          tests.append(('long-very-large',pkt('u'*40,'p'*700,'r'*40,4)))
          for host in HOSTS:
              print('===== HOST',host,'=====')
              ips=[]
              for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM):
                  ip=x[4][0]
                  if ':' not in ip and ip not in ips: ips.append(ip)
              print('DNS',ips)
              for ip in ips[:2]:
                  print('--- backend',ip,'---')
                  for label,raw in tests:
                      try:
                          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
                          with socket.create_connection((ip,443),timeout=5) as s:
                              with ctx.wrap_socket(s,server_hostname=host) as ss:
                                  fp=hashlib.sha256(ss.getpeercert(binary_form=True)).hexdigest()
                                  ss.settimeout(5); ss.sendall(raw)
                                  try: resp=ss.recv(64)
                                  except socket.timeout: resp=b''
                                  if len(resp)>=4 and resp[:2]==b'\x20\x02': desc=f'CONNACK rc={resp[3]} hex={resp.hex()}'
                                  elif resp: desc=f'PACKET {resp.hex()}'
                                  else: desc='TIMEOUT_NO_BYTES'
                                  print(label,'bytes='+str(len(raw)),'sha256='+fp,'RECV',desc)
                      except Exception as e: print(label,'ERROR',type(e).__name__,repr(e))
          PY
      - name: Commit probe result
        shell: bash
        run: |
          git config user.name 'x9-probe-bot'
          git config user.email 'x9-probe-bot@users.noreply.github.com'
          git add x9_broker_probe_result.txt
          git commit -m 'temp: X9 broker long-connect result' || exit 0
          git push
