name: X9 Broker Probe Temp

on:
  push:
    paths:
      - '.github/workflows/x9-broker-probe-temp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ECOVACS MQTT endpoints without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import socket, ssl, hashlib, struct, time

          HOSTS = [
              'mq.ecouser.net',
              'jmq-ngiot-cn.dc.cn.ecouser.net',
          ]

          def encstr(s):
              b = s.encode('utf-8')
              return struct.pack('!H', len(b)) + b

          def rem_len(n):
              out = bytearray()
              while True:
                  d = n % 128
                  n //= 128
                  if n:
                      d |= 0x80
                  out.append(d)
                  if not n:
                      return bytes(out)

          def connect_packet(proto='3.1.1', creds=False, client_id='x9-safe-anon-probe'):
              if proto == '3.1.1':
                  vh = encstr('MQTT') + bytes([4])
              else:
                  vh = encstr('MQIsdp') + bytes([3])
              flags = 0x02
              payload = encstr(client_id)
              if creds:
                  flags |= 0xC0
                  payload += encstr('invalid-x9-probe-user') + encstr('invalid-x9-probe-token')
              vh += bytes([flags]) + struct.pack('!H', 60)
              body = vh + payload
              return bytes([0x10]) + rem_len(len(body)) + body

          def describe(resp):
              if not resp:
                  return 'NO_BYTES'
              h = resp.hex()
              if len(resp) >= 4 and resp[0] == 0x20 and resp[1] == 0x02:
                  return f'CONNACK flags={resp[2]} rc={resp[3]} hex={h}'
              return f'PACKET first=0x{resp[0]:02x} len={len(resp)} hex={h}'

          for host in HOSTS:
              print(f'===== HOST {host} =====', flush=True)
              try:
                  infos = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                  ips=[]
                  for inf in infos:
                      ip=inf[4][0]
                      if ':' not in ip and ip not in ips:
                          ips.append(ip)
                  print('DNS', ips, flush=True)
              except Exception as e:
                  print('DNS_ERROR', repr(e), flush=True)
                  continue

              for ip in ips[:3]:
                  print(f'--- backend {ip} ---', flush=True)
                  for proto, creds in [('3.1.1',False),('3.1.1',True),('3.1',False),('3.1',True)]:
                      label=f'proto={proto} creds={"dummy" if creds else "none"}'
                      raw = connect_packet(proto, creds, client_id=f'x9-probe-{int(time.time()*1000)%1000000}')
                      try:
                          ctx=ssl.create_default_context()
                          ctx.check_hostname=False
                          ctx.verify_mode=ssl.CERT_NONE
                          with socket.create_connection((ip,443), timeout=5) as s:
                              with ctx.wrap_socket(s, server_hostname=host) as ss:
                                  cert=ss.getpeercert(binary_form=True)
                                  fp=hashlib.sha256(cert).hexdigest()
                                  print(label, 'TLS', ss.version(), 'cipher='+ss.cipher()[0], 'sha256='+fp, flush=True)
                                  ss.settimeout(5)
                                  ss.sendall(raw)
                                  print(label, 'SENT', len(raw), flush=True)
                                  try:
                                      resp=ss.recv(64)
                                      print(label, 'RECV', describe(resp), flush=True)
                                  except socket.timeout:
                                      print(label, 'RECV TIMEOUT_NO_BYTES', flush=True)
                      except Exception as e:
                          print(label, 'ERROR', type(e).__name__, repr(e), flush=True)
          PY
